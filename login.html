<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · LibreTV</title>
    <link rel="icon" href="image/logo.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0b0c0e; color: #e8eaed;
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
        .card { width: min(92vw, 360px); }
        .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
        .logo svg { width: 34px; height: 34px; color: #00ccff; }
        .logo span { font-size: 19px; font-weight: 600; letter-spacing: .5px; }
        input {
            width: 100%; padding: 13px 15px; font-size: 15px; color: #fff;
            background: #121417; border: 1px solid #2a2e35; border-radius: 10px; outline: none;
        }
        input:focus { border-color: #00ccff; }
        button {
            width: 100%; margin-top: 12px; padding: 13px 15px; font-size: 15px; font-weight: 600;
            color: #04121a; background: #00ccff; border: 0; border-radius: 10px; cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: default; }
        .err { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .hint { color: #6b7076; font-size: 12px; margin-top: 14px; text-align: center; }
    </style>
</head>
<body>
    <form class="card" id="f">
        <div class="logo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <span>LibreTV</span>
        </div>
        <input id="pw" type="password" placeholder="请输入访问密码" autocomplete="current-password" autofocus>
        <button id="btn" type="submit">进入</button>
        <div class="err" id="err"></div>
        <div class="hint">本站为私有部署，需要密码访问</div>
    </form>
    <script>
        (function () {
            var next = new URLSearchParams(location.search).get('next') || '/';
            // 只允许站内跳转，避免被当成开放重定向
            if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/';
            var f = document.getElementById('f');
            var pw = document.getElementById('pw');
            var btn = document.getElementById('btn');
            var err = document.getElementById('err');
            f.addEventListener('submit', function (e) {
                e.preventDefault();
                err.textContent = '';
                btn.disabled = true;
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ password: pw.value })
                }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d, s: r.status }; }); })
                    .then(function (res) {
                        if (res.ok && res.d.ok) { location.replace(next); return; }
                        err.textContent = res.s === 429 ? '尝试过于频繁，请稍后再试' : '密码错误';
                        btn.disabled = false;
                        pw.select();
                    })
                    .catch(function () { err.textContent = '网络错误，请重试'; btn.disabled = false; });
            });
        })();
    </script>
</body>
</html>
