# netlify.toml

[build]
  # 构建脚本生成面向 iOS 13.1 / Safari 13.1 的降级产物（Tailwind 预编译 + Babel + PostCSS）
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions" # 指定 Netlify 函数目录

# 配置 Edge Functions
[[edge_functions]]
  function = "inject-env"
  path = "/*"

# 配置重写规则，将 /proxy/* 的请求路由到 proxy 函数
# 这样前端的 PROXY_URL 仍然可以是 '/proxy/'
[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/proxy/:splat" # 将路径参数传递给函数
  status = 200 # 重要：这是代理，不是重定向

# 处理搜索路径格式 /s=*
[[redirects]]
  from = "/s=*"
  to = "/index.html"
  status = 200

# （可选）为其他静态文件设置缓存头等
# [[headers]]
#   for = "/*"
#   [headers.values]
#     # Add any global headers here
